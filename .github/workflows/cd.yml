name: AETHRA CD Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate AWS OIDC Configuration
        shell: bash
        env:
          ROLE_VAR: ${{ vars.AWS_ROLE_ARN }}
          ROLE_SECRET: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          ROLE="${ROLE_VAR:-$ROLE_SECRET}"
          CLEAN_ROLE=$(echo "$ROLE" | tr -d '[:space:]"')
          echo "AWS OIDC Role check:"
          echo "  - AWS_ROLE_ARN in variables: $([ -n "$ROLE_VAR" ] && echo 'FOUND' || echo 'NOT FOUND')"
          echo "  - AWS_ROLE_ARN in secrets:   $([ -n "$ROLE_SECRET" ] && echo 'FOUND' || echo 'NOT FOUND')"

          if [ -z "$CLEAN_ROLE" ]; then
            echo "::error::AWS_ROLE_ARN is missing. Please configure AWS_ROLE_ARN in GitHub: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Target Account ARN prefix: $(echo "$CLEAN_ROLE" | cut -d':' -f1-5)"
          echo "CLEAN_ROLE_ARN=$CLEAN_ROLE" >> $GITHUB_ENV

      - name: Inspect GitHub OIDC Token Claims
        shell: bash
        run: |
          TOKEN=$(curl -sLS -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value // empty')
          if [ -n "$TOKEN" ]; then
            echo "GitHub OIDC Token Claims:"
            echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, environment}' || true
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CLEAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com
          role-session-tagging: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init & Validate
        run: |
          cd infrastructure/terraform
          terraform init
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform plan -out=tfplan

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan

  build-and-deploy-services:
    name: Build Docker & Deploy to ECS Fargate
    needs: [deploy-infrastructure]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        service:
          - api-gateway
          - web-bff
          - mobile-bff
          - identity-service
          - organisation-service
          - access-control-service
          - subscription-service
          - customer-service
          - vendor-relationship-service
          - crm-service
          - catalogue-service
          - engineering-service
          - quotation-service
          - inventory-service
          - procurement-service
          - project-service
          - document-service
          - notification-service
          - service-management-service
          - reporting-service
          - integration-service
          - audit-service
          - ai-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com
          role-session-tagging: false

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aethra/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest -f infrastructure/docker/Dockerfile.service .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy to ECS Fargate Service
        run: |
          aws ecs update-service --cluster aethra-production-ecs-cluster --service aethra-${{ matrix.service }} --force-new-deployment --region ap-south-1
