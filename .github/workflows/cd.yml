name: AETHRA CD Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::067518243733:role/aethra-github-actions-deployer
  AWS_REGION: ap-south-1

jobs:
  deploy-infrastructure:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate AWS Configuration
        shell: bash
        run: |
          echo "Checking AWS configuration..."

          if [ "$AWS_ROLE_ARN" != "arn:aws:iam::067518243733:role/aethra-github-actions-deployer" ]; then
            echo "::error::Incorrect AWS Role ARN"
            exit 1
          fi

          echo "Role ARN: $AWS_ROLE_ARN"
          echo "Region: $AWS_REGION"

      - name: Inspect GitHub OIDC Claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Unable to retrieve GitHub OIDC token"
            exit 1
          fi

          export TOKEN

          python3 -c '
          import os, json, base64
          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref")
          }, indent=2))
          '

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init & Validate
        working-directory: infrastructure/terraform
        run: |
          terraform init
          terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan

  build-and-deploy-services:
    name: Build Docker & Deploy to ECS Fargate
    needs: [deploy-infrastructure]
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - web-bff
          - mobile-bff
          - identity-service
          - organisation-service
          - access-control-service
          - subscription-service
          - customer-service
          - vendor-relationship-service
          - crm-service
          - catalogue-service
          - engineering-service
          - quotation-service
          - inventory-service
          - procurement-service
          - project-service
          - document-service
          - notification-service
          - service-management-service
          - reporting-service
          - integration-service
          - audit-service
          - ai-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aethra/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:latest \
            -f infrastructure/docker/Dockerfile.service .

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster aethra-production-ecs-cluster \
            --service aethra-${{ matrix.service }} \
            --force-new-deployment \
            --region "$AWS_REGION"
