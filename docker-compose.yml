version: '3.8'

# ==============================================================================
# AETHRA — Local Development Backing Services Orchestration
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Multi-Database Cluster)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aethra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aethra-network

  # ----------------------------------------------------------------------------
  # Redis 7.x (Cache, Rate Limiting & Job Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aethra-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aethra-network

  # ----------------------------------------------------------------------------
  # Redpanda (Kafka-compatible Event Streaming Broker — Zero JVM / Fast Boot)
  # ----------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: aethra-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr
      - 0.0.0.0:8081
    ports:
      - '9092:9092'
      - '8081:8081'
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aethra-network

  # ----------------------------------------------------------------------------
  # Redpanda Console (Web UI for Topics, Messages, Consumer Groups & Schemas)
  # ----------------------------------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: aethra-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: 'true'
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - '8080:8080'
    networks:
      - aethra-network

  # ----------------------------------------------------------------------------
  # MinIO (Local S3-compatible Object Storage for Private Documents)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aethra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - aethra-network

  # ----------------------------------------------------------------------------
  # Jaeger (Distributed Tracing UI & OTLP Receiver)
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: aethra-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686' # Jaeger Web UI
      - '4318:4318'   # OTLP HTTP receiver
    networks:
      - aethra-network

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:

networks:
  aethra-network:
    driver: bridge
